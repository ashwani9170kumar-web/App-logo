<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#dcefff"><title>MYTH 3D LAB — For Study</title><style>
:root{--blue:#0756bf;--navy:#092d78;--cyan:#00b8ff;--glass:rgba(255,255,255,.48)}*{box-sizing:border-box}body{margin:0;color:var(--navy);font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;background:radial-gradient(ellipse at 70% 20%,#fff7e7 0%,transparent 36%),radial-gradient(ellipse at 2% 75%,#c5d8ff 0%,transparent 44%),linear-gradient(120deg,#d4edff,#f7fbff 50%,#d1e6ff);overflow-x:hidden}.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}.blob{position:absolute;border-radius:43% 57% 58% 42%/55% 40% 60% 45%;filter:blur(3px);opacity:.52;animation:float 13s ease-in-out infinite alternate}.b1{width:420px;height:420px;background:radial-gradient(circle at 35% 35%,#fff,#80d9ff 45%,#b3a4ff 70%,transparent 75%);top:-170px;right:-130px}.b2{width:320px;height:320px;background:radial-gradient(circle,#fff,#8ad7ff 50%,#b7a4fc 75%,transparent);bottom:-130px;left:-90px;animation-delay:-4s}.b3{width:180px;height:180px;background:radial-gradient(circle,#fff,#7de6ff 48%,transparent 75%);top:40%;left:43%;animation-delay:-7s}@keyframes float{to{transform:translate(35px,45px) rotate(25deg)}}.shell{max-width:1480px;margin:auto;padding:14px clamp(15px,3vw,44px) 34px}.glass{background:linear-gradient(145deg,rgba(255,255,255,.76),rgba(255,255,255,.25));border:1.5px solid rgba(255,255,255,.94);box-shadow:0 14px 35px #336baf1c,inset 0 1px 2px #fff,inset 0 -2px 5px #8cbbf330;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}header{display:flex;align-items:center;justify-content:space-between;gap:15px;border-radius:100px;padding:8px 25px;min-height:82px}.brand{display:flex;align-items:center;gap:10px;cursor:pointer}.brand img{width:69px;height:69px;object-fit:contain;border-radius:20px;mix-blend-mode:multiply}.brand strong{font-size:16px;line-height:1.05}.brand small{display:block;font-size:11px}.nav{display:flex;gap:10px;align-items:center}.nav button,.chip{border:1px solid transparent;background:transparent;border-radius:28px; adding:11px 7px;gap:6px}.feature b{font-size:11px}.feature small{font-size:10px}.feature .ico{font-size:22px}.sectiontop .linkbtn{font-size:11px;padding:8px}.foldergrid{grid-template-columns:1fr}.bubble.one{left:5%}}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const subjects=()=>[...defaultSubjects,...[...new Set(catalog.map(f=>f.subject))].filter(s=>!defaultSubjects.some(x=>x.name===s)).map(name=>({name,icon:'📚',desc:'Interactive study material'}))];
function card(s){return `<button class="card glass" data-subject="${esc(s.name)}" onclick="selectSubject(this.dataset.subject)"><div class="symbol">${s.icon}</div><h3>${esc(s.name)}</h3><p>${esc(s.desc)}</p><span class="arrow">→</span></button>`}
function go(p,scroll=false){page=p;render();window.scrollTo({top:scroll?Math.max(0,(document.querySelector('.section')?.offsetTop||0)-20):0,behavior:'smooth'})}
function selectSubject(name){selectedSubject=name;go('science')}
function selectFolder(name){selectedFolder=name;go('physics')}
function render(){let m=document.getElementById('main');if(page==='home'){m.innerHTML=`<section class="hero"><div class="copy"><span class="pill">✦ Welcome to</span><h1>MYTH <span class="bright">3D</span> LAB</h1><div class="subtitle">— For Study —</div><p class="tag">Interactive 3D Simulations | Concept Clarity | Better Learning</p><p class="desc">Explore the world of Science and Mathematics with immersive 3D simulations and easy-to-understand study material.</p><form class="search glass" onsubmit="event.preventDefault();search()"><span style="font-size:24px">⌕</span><input id="query" placeholder="Search subject, topic or simulation..." value="${esc(term)}" oninput="filterCards()"><button aria-label="Search">➜</button></form></div><div class="heroart"><span class="bubble one"></span><span class="bubble two"></span><span class="bubble three"></span><div class="orb"><img src="${logo}" alt="MYTH 3D LAB logo"></div><div class="slogan">Better<br>Concepts<br>Brighter<br>Future</div></div></section><section class="section glass" id="subjects"><div class="sectiontop"><div><h2>⚛ Explore Subjects</h2><p>Choose a subject and start your 3D learning journey</p></div><button class="linkbtn" onclick="document.getElementById('query').focus()">View All Subjects →</button></div><div class="cards" id="subjectcards">${subjects().map(card).join('')}</div></section><div class="features"><div class="feature glass"><span class="ico">🧊</span><div><b>3D Interactive Simulations</b><small>Learn by Doing</small></div></div><div class="feature glass"><span class="ico">🧠</span><div><b>Simple & Clear Concepts</b><small>Easy to Understand</small></div></div><div class="feature glass"><span class="ico">🎯</span><div><b>Exam Focused Learning</b><small>Build Strong Foundation</small></div></div><div class="feature glass"><span class="ico">📱</span><div><b>Mobile Friendly Design</b><small>Learn Anywhere, Anytime</small></div></div></div>`;filterCards()}
else if(page==='science'){
let folders=[...new Set(catalog.filter(f=>f.subject===selectedSubject).map(f=>f.folder))];if(selectedSubject==='Science 3D Lab'&&!folders.includes('Physics 3D Study Material'))folders.unshift('Physics 3D Study Material');
m.innerHTML=`<section class="section glass" style="margin-top:30px"><div class="crumb"><button onclick="go('home')">Home</button> › <b>${esc(selectedSubject)}</b></div><div class="sectiontop"><div><h2>⚛ ${esc(selectedSubject)}</h2><p>Explore your learning folders</p></div><button class="back" onclick="go('home')">← Back</button></div><div class="foldergrid">${folders.map((name,i)=>`<button class="card folder glass" data-folder="${esc(name)}" onclick="selectFolder(this.dataset.folder)"><div class="symbol">📁</div><h3>${esc(name)}</h3><p>Interactive simulations and visual lessons</p><span class="arrow" style="margin:0">→</span></button>`).join('')||'<p class="notice">Study materials coming soon.</p>'}</div></section>`}
else if(page==='physics'){
let files=catalog.filter(f=>f.subject===selectedSubject&&f.folder===selectedFolder);
m.innerHTML=`<section class="section glass" style="margin-top:30px"><div class="crumb"><button onclick="go('home')">Home</button> › <button onclick="go('science')">${esc(selectedSubject)}</button> › <b>${esc(selectedFolder)}</b></div><div class="sectiontop"><div><h2>📁 ${esc(selectedFolder)}</h2><p>Choose a simulation to start learning</p></div><button class="back" onclick="go('science')">← Back</button></div><div class="files">${files.map((f,i)=>`<button class="file glass" onclick="openFile(${i})">🔬 <span>${esc(f.title)}</span> →</button>`).join('')||'<p class="notice">No HTML simulations published in this folder yet.</p>'}</div></section>`}
else if(page==='viewer'&&selectedFile){m.innerHTML=`<section class="section glass" style="margin-top:24px"><div class="sectiontop"><h2>${esc(selectedFile.title)}</h2><button class="back" onclick="go('physics')">← Back</button></div><div class="viewer"><iframe title="${esc(selectedFile.title)}" src="${esc(selectedFile.url)}" allowfullscreen loading="lazy"></iframe></div><p class="notice"><a href="${esc(selectedFile.url)}" target="_blank" rel="noopener">Open simulation full screen ↗</a></p></section>`}}
function search(){term=document.getElementById('query').value;filterCards();document.getElementById('subjects').scrollIntoView({behavior:'smooth'})}
function filterCards(){let input=document.getElementById('query');if(!input)return;term=input.value;let q=term.trim().toLowerCase();let matches=subjects().filter(s=>s.name.toLowerCase().includes(q)||s.desc.toLowerCase().includes(q)||catalog.some(f=>f.subject===s.name&&(f.title.toLowerCase().includes(q)||f.folder.toLowerCase().includes(q))));document.getElementById('subjectcards').innerHTML=matches.length?matches.map(card).join(''):'<p>No matching subjects found.</p>'}
function openFile(i){selectedFile=catalog.filter(f=>f.subject===selectedSubject&&f.folder===selectedFolder)[i];if(selectedFile)go('viewer')}
function info(t){alert(t==='About'?'MYTH 3D LAB For Study — Interactive 3D learning portal.':'Browse subjects, open Science 3D Lab, then Physics 3D Study Material to view simulations.')}
async function loadCatalog(){try{const response=await fetch('materials.json',{cache:'no-store'});if(!response.ok)throw Error('Not found');const data=await response.json();catalog=(Array.isArray(data.files)?data.files:[]).filter(f=>typeof f.subject==='string'&&typeof f.folder==='string'&&typeof f.title==='string'&&typeof f.url==='string'&&!/^(?:[a-z]+:|\/|\\)/i.test(f.url)&&!f.url.includes('..'));}catch(e){console.warn('Material list unavailable until GitHub Pages deployment.',e)}render()}
render();loadCatalog();
</script></body></html>
