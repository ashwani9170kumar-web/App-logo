<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7faff">
<title>MYTH LEARNER Super Access Key</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#1c2945}
body{min-height:100vh;min-height:100svh;width:100%;display:grid;place-items:center;overflow-x:hidden;overflow-y:auto;padding:max(14px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:linear-gradient(120deg,#fffdf5,#f5f8ff,#fff5e8,#f4f0ff,#fafffb);background-size:350% 350%;animation:bgShift 16s ease infinite}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.ambient{position:fixed;inset:-25%;z-index:-2;filter:blur(75px);pointer-events:none}
.blob{position:absolute;width:43vw;height:43vw;min-width:260px;min-height:260px;border-radius:50%;opacity:.48;mix-blend-mode:multiply;animation:float 18s ease-in-out infinite alternate}
.b1{background:#9bbcff;left:2%;top:3%}.b2{background:#d6a8ff;right:1%;top:8%;animation-delay:-5s;animation-duration:22s}.b3{background:#9be9dc;left:30%;bottom:-8%;animation-delay:-8s;animation-duration:24s}.b4{background:#ffd2b7;right:16%;bottom:0;animation-delay:-3s;animation-duration:20s}
@keyframes float{0%{transform:translate(-3%,1%) scale(.92)}50%{transform:translate(8%,-7%) scale(1.12)}100%{transform:translate(-6%,8%) scale(1.02)}}
.card{width:min(100%,510px);max-width:100%;padding:clamp(18px,4.5vh,32px) clamp(16px,5vw,25px) clamp(16px,3.5vh,25px);text-align:center;position:relative;border:1px solid #ffffffed;border-radius:30px;background:linear-gradient(145deg,#ffffffd9,#ffffff8a);backdrop-filter:blur(26px) saturate(165%);-webkit-backdrop-filter:blur(26px) saturate(165%);box-shadow:0 25px 80px #44578729,inset 0 1px 0 #fff}
.logo{width:clamp(54px,12vw,88px);height:clamp(54px,12vw,88px);margin:0 auto clamp(9px,2.5vh,16px);display:block;object-fit:contain;border-radius:22px;filter:drop-shadow(0 10px 18px #4b5b8730)}
h1{font-size:clamp(24px,6vw,30px);line-height:1.25;letter-spacing:-.8px;margin:0 auto 10px;font-weight:900;overflow-wrap:anywhere}
.gold-title{display:inline-block;background:linear-gradient(100deg,#8b6414,#f6d879,#b88722,#fff0a8,#956713);background-size:250% auto;color:transparent;background-clip:text;-webkit-background-clip:text;animation:goldShine 3.8s linear infinite;text-shadow:0 2px 16px #d6a83c30}
@keyframes goldShine{to{background-position:250% center}}
.sub{margin:0 0 clamp(12px,3.5vh,27px);color:#71809a;font-size:13px}
.tag{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;margin-bottom:clamp(10px,2.8vh,22px);border:1px solid #ffffffed;border-radius:99px;background:#ffffff80;color:#4f5d83;font-size:10px;font-weight:850;letter-spacing:1.4px}
.dot{width:7px;height:7px;border-radius:50%;background:#32bd91;box-shadow:0 0 0 4px #32bd9122}
.label{margin-bottom:10px;color:#77849c;font-size:10px;font-weight:800;letter-spacing:1.8px}
.keybox{min-height:88px;padding:18px 12px;display:flex;align-items:center;justify-content:center;position:relative;border:1.5px solid transparent;border-radius:19px;background:linear-gradient(120deg,#fffdf5,#fff,#fff8df) padding-box,linear-gradient(110deg,#9b711c,#ffe59a,#c18a1d,#fff0b7,#9b711c) border-box;background-size:100% 100%,250% 250%;animation:keyGlow 4s linear infinite;box-shadow:0 0 0 4px #e9c76a20,0 12px 35px #c99b352e,inset 0 1px 8px #fff8d8;overflow-wrap:anywhere}
@keyframes keyGlow{0%{background-position:0 0,0% 50%;box-shadow:0 0 0 4px #e9c76a20,0 12px 35px #c99b352e,inset 0 1px 8px #fff8d8}50%{box-shadow:0 0 0 7px #e9c76a30,0 14px 40px #c99b3550,inset 0 1px 8px #fff8d8}100%{background-position:0 0,250% 50%;box-shadow:0 0 0 4px #e9c76a20,0 12px 35px #c99b352e,inset 0 1px 8px #fff8d8}}
#key{font:900 clamp(13px,3.65vw,18px)/1.7 ui-monospace,Consolas,monospace;letter-spacing:.4px;word-break:break-word;color:#705018;text-shadow:0 1px 0 #fff}
button{width:100%;border:0;border-radius:15px;padding:16px;margin-top:16px;color:white;background:linear-gradient(110deg,#7764f2,#5265d9 55%,#7d65e8);box-shadow:0 11px 24px #5e59d33d,inset 0 1px 1px #ffffff66;font-size:13px;font-weight:900;letter-spacing:1.3px;cursor:pointer}
button:active{transform:scale(.99)}
.status{min-height:22px;margin-top:12px;color:#168665;font-size:12px;font-weight:700}
footer{margin-top:clamp(12px,2.8vh,22px);color:#8390a8;font-size:10px;font-weight:800;letter-spacing:1.8px}
@media(max-width:380px){.card{padding:18px 14px 16px;border-radius:23px}#key{font-size:clamp(10px,3.5vw,12px);letter-spacing:0}.keybox{padding:13px 8px;min-height:72px}button{padding:14px;margin-top:12px}}
@media(max-height:650px){body{place-items:center;padding-top:10px;padding-bottom:10px}.card{padding-top:14px;padding-bottom:13px}.logo{width:48px;height:48px;margin-bottom:7px}h1{font-size:clamp(19px,4.5vw,25px);margin-bottom:5px}.sub{margin-bottom:8px}.tag{margin-bottom:8px;padding:6px 10px}.label{margin-bottom:6px}.keybox{min-height:64px;padding:10px 8px}button{margin-top:10px;padding:12px}.status{margin-top:6px;min-height:16px}footer{margin-top:8px}}
@media(orientation:landscape) and (max-height:520px){body{padding:8px}.card{width:min(100%,620px);padding:10px 18px}.logo{width:38px;height:38px;margin-bottom:4px}h1{font-size:19px}.sub{display:none}.tag{margin:5px 0;padding:5px 9px}.keybox{min-height:54px;padding:7px}button{padding:9px;margin-top:8px}.status{margin-top:4px}footer{margin-top:5px}}
@media(prefers-reduced-motion:reduce){.blob,.gold-title,body,.keybox{animation:none}}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div></div>
<main class="card">
 <img class="logo" src="https://myth-raw-link-maker.pages.dev/file/MYTH%20LEARNER%20APP%20LOGO.png" alt="MYTH LEARNER App Logo">
 <h1>MYTH LEARNER<br><span class="gold-title">Super Access Key 🗝️</span></h1>
 <p class="sub">Your MYTH LEARNER access key</p>
 <div class="tag"><span class="dot"></span> ACCESS KEY</div>
 <div class="label">YOUR ACCESS KEY</div>
 <div class="keybox"><span id="key" aria-live="polite">Generating key…</span></div>
 <button id="copy" type="button">COPY ACCESS KEY</button>
 <div class="status" id="status" aria-live="polite"></div>
 <footer>POWERED BY MYTH BROTHERS</footer>
</main>
<script>
(()=>{
 "use strict";
 // Same UTC time slot yields the same key on every device.
 // The reversible encoding makes each slot unique within the 21-character key space.
 const PERIOD=3*60*60*1000;
 const ALPHABET="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
 const WIDTHS=[3,4,5,4,5];
 const TOTAL=21;
 const BASE=36n;
 const SPACE=BASE**BigInt(TOTAL);
 // Multiplier is coprime to 36, so the mapping is one-to-one before the space wraps.
 const MULTIPLIER=35n;
 const OFFSET=987654321987654321987654321n;
 const keyNode=document.getElementById("key");
 const statusNode=document.getElementById("status");
 const copyButton=document.getElementById("copy");
 let currentKey="";

 function encodeFixed(value,width){
   let s="";
   for(let i=0;i<width;i++){s=ALPHABET[Number(value%BASE)]+s;value/=BASE;}
   return s;
 }
 function createKey(slot){
   const mapped=(BigInt(slot)*MULTIPLIER+OFFSET)%SPACE;
   let remaining=mapped;
   const chunks=[];
   for(const width of WIDTHS){
     const divisor=BASE**BigInt(width);
     chunks.push(encodeFixed(remaining%divisor,width));
     remaining/=divisor;
   }
   const [s,u,p,e,r]=chunks;
   return `MYTH-S${s}-U${u}-P${p}-E${e}-R${r}`;
 }
 function refresh(){
   const slot=Math.floor(Date.now()/PERIOD);
   const next=createKey(slot);
   if(next!==currentKey){
     currentKey=next;
     keyNode.textContent=currentKey;
     statusNode.textContent="Access key ready";
   }
 }
 copyButton.addEventListener("click",async()=>{
   if(!currentKey)return;
   try{
     await navigator.clipboard.writeText(currentKey);
     statusNode.textContent="✓ Access key copied";
   }catch{
     const t=document.createElement("textarea");
     t.value=currentKey;t.style.position="fixed";t.style.opacity="0";
     document.body.appendChild(t);t.select();
     const ok=document.execCommand("copy");t.remove();
     statusNode.textContent=ok?"✓ Access key copied":"Please select and copy the key manually.";
   }
 });
 refresh();
 setInterval(refresh,500);
})();
</script>
</body>
</html>
